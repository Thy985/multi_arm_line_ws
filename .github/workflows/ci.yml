name: Multi-Arm CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ROS_DISTRO: jazzy

jobs:
  layer1-build:
    name: Layer 1 - Build
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Install colcon
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-colcon-common-extensions

      - name: Install optional ROS2 packages
        shell: bash
        run: |
          apt-get install -y -qq \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-moveit \
            2>/dev/null || echo "WARN: Some optional packages unavailable"
        continue-on-error: true

      - name: Build multi_arm packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select \
            multi_arm_interfaces multi_arm_core multi_arm_safety \
            multi_arm_world_model multi_arm_task_planner \
            multi_arm_recovery multi_arm_benchmark

      - name: Build simulation packages (optional)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon build --packages-select order_manager ur_simulation_gz || \
            echo "WARN: Simulation packages skipped (missing deps)"
        continue-on-error: true

  layer2-test:
    name: Layer 2 - Unit Tests
    needs: layer1-build
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Install colcon
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-colcon-common-extensions

      - name: Install optional ROS2 packages
        shell: bash
        run: |
          apt-get install -y -qq \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-moveit \
            2>/dev/null || echo "WARN: Some optional packages unavailable"
        continue-on-error: true

      - name: Build core packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select \
            multi_arm_interfaces multi_arm_core multi_arm_safety \
            multi_arm_world_model multi_arm_task_planner \
            multi_arm_recovery multi_arm_benchmark

      - name: Run unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_HOME=/tmp/ros_home
          export ROS_LOG_DIR=/tmp/ros_home/log
          colcon test --packages-select \
            multi_arm_interfaces multi_arm_core multi_arm_safety \
            multi_arm_world_model multi_arm_task_planner \
            multi_arm_recovery multi_arm_benchmark
          colcon test-result --verbose

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: log/

  interface-compat:
    name: Interface Compatibility Check
    needs: layer1-build
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install colcon
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-colcon-common-extensions

      - name: Install optional ROS2 packages
        shell: bash
        run: |
          apt-get install -y -qq \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-moveit \
            2>/dev/null || echo "WARN: Some optional packages unavailable"
        continue-on-error: true

      - name: Check interface changes
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- src/multi_arm_interfaces/ | head -1 || true)
          if [ -n "$CHANGED" ]; then
            echo "Interface changes detected — running full rebuild + test"
            colcon build --packages-select multi_arm_interfaces
            source install/setup.bash
            colcon build --packages-select \
              multi_arm_core multi_arm_safety multi_arm_world_model \
              multi_arm_task_planner multi_arm_recovery multi_arm_benchmark
            export ROS_HOME=/tmp/ros_home
            export ROS_LOG_DIR=/tmp/ros_home/log
            colcon test --packages-select \
              multi_arm_core multi_arm_safety multi_arm_world_model \
              multi_arm_task_planner multi_arm_recovery multi_arm_benchmark
            colcon test-result --verbose
          else
            echo "No interface changes — skipping full test"
          fi

  performance-regression:
    name: Performance Regression Check
    needs: layer2-test
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Install colcon
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-colcon-common-extensions

      - name: Install optional ROS2 packages
        shell: bash
        run: |
          apt-get install -y -qq \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-moveit \
            2>/dev/null || echo "WARN: Some optional packages unavailable"
        continue-on-error: true

      - name: Build and check regression
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select \
            multi_arm_interfaces multi_arm_core multi_arm_safety \
            multi_arm_world_model multi_arm_task_planner \
            multi_arm_recovery multi_arm_benchmark
          source install/setup.bash
          export ROS_HOME=/tmp/ros_home
          python3 -c "
          from multi_arm_benchmark.benchmark_recorder import BenchmarkRecorder
          from multi_arm_benchmark.regression_detector import RegressionDetector
          recorder = BenchmarkRecorder()
          history = recorder.get_scenario_history('single_arm', limit=5)
          if len(history) >= 2:
              detector = RegressionDetector()
              result = detector.compare_runs(history[0], history[1])
              if result['regressed']:
                  print(f'REGRESSION DETECTED: {result[\"regressions\"]}')
                  exit(1)
              else:
                  print('No regression detected')
          else:
              print('Insufficient history for regression check (need >=2 runs)')
          recorder.close()
          "
