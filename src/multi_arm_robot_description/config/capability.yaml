capabilities:
  manipulation:
    type: joint_position
    dof: 6
    payload_kg: 5.0
    available: true
    precision_mm: 0.1
    requires: ["arm_reachable"]

  force_control:
    available: false
    reason: "UR5e simulation has no force control"
    conflicts_with: ["manipulation"]

  gripper:
    type: parallel_jaw
    max_opening_mm: 85
    available: true
    model: "robotiq_2f_85"

  vision:
    types: ["rgb"]
    available: true
    reason: "arm1 wrist camera (Gazebo sensor)"

  mobile:
    available: false
    reason: "M7.6 not yet implemented"

  skills:
    available: true
    list: ["pick_object", "place_object", "move_object"]
    reason: "M6.3 Skill Runtime"
    requires: ["manipulation", "gripper"]

dynamic_capabilities:
  payload_remaining:
    compute: "max_payload - current_load"
    default: 5.0

  gripper_temperature:
    compute: "gripper_sensor_temperature"
    default: 25.0
    threshold_overheat: 80.0

  arm_reachable:
    compute: "workspace_check(current_pose)"
    default: true

context_capabilities:
  can_reach:
    compute: "workspace_intersection(zone)"
    depends_on: world_model
    requires: ["manipulation"]

  can_grasp:
    compute: "object_size < max_opening"
    depends_on: world_model
    requires: ["gripper"]

  path_clear:
    compute: "collision_check(target)"
    depends_on: world_model
    requires: ["manipulation"]
