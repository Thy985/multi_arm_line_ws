capabilities:
  manipulation:
    type: joint_position
    dof: 6
    payload_kg: 5.0
    available: true
    precision_mm: 0.1
    requires: ["arm_reachable"]

  force_control:
    available: false
    reason: "UR5e simulation has no force control"
    conflicts_with: ["manipulation"]

  gripper:
    type: parallel_jaw
    max_opening_mm: 85
    available: true
    model: "robotiq_2f_85"

  vision:
    types: ["rgb", "depth"]
    available: true
    reason: "head_rgb RGB-D (M7.1) + left_arm wrist camera"
    sensors:
      - name: head_rgb
        types: ["rgb", "depth"]
        resolution: [640, 480]
        fps: 30
      - name: left_arm_wrist_camera
        types: ["rgb"]
        resolution: [640, 480]
        fps: 10

  perception:
    available: true
    reason: "M7.5 ColorDetector + M7.4 vision grounding"
    pipeline: "image -> color_detect -> pose_estimate -> worldmodel_update"
    confidence_threshold: 0.5
    contradiction_threshold_m: 0.3

  body_control:
    available: true
    reason: "M7.1 torso + head"
    joints:
      - torso_yaw_joint
      - neck_pitch_joint
    controllers:
      - torso_controller
      - head_controller

  imu:
    available: true
    reason: "M7.1 head_imu on torso_link"
    sensor: head_imu
    frame: torso_link

  mobile:
    available: false
    reason: "M8 not yet implemented"

  skills:
    available: true
    list: ["pick_object", "place_object", "move_object"]
    reason: "M6.3 Skill Runtime"
    requires: ["manipulation", "gripper"]

  evaluation:
    available: true
    reason: "M7.FINAL independent evaluation layer"
    gt_isolated: true
    scenarios: 15
    invariants: 7

dynamic_capabilities:
  payload_remaining:
    compute: "max_payload - current_load"
    default: 5.0

  gripper_temperature:
    compute: "gripper_sensor_temperature"
    default: 25.0
    threshold_overheat: 80.0

  arm_reachable:
    compute: "workspace_check(current_pose)"
    default: true

  head_attention:
    compute: "neck_pitch_joint angle"
    default: 0.0
    range: [-1.57, 1.57]

  torso_orientation:
    compute: "head_imu quaternion"
    default: [0.0, 0.0, 0.0, 1.0]

context_capabilities:
  can_reach:
    compute: "workspace_intersection(zone)"
    depends_on: world_model
    requires: ["manipulation"]

  can_grasp:
    compute: "object_size < max_opening"
    depends_on: world_model
    requires: ["gripper"]

  path_clear:
    compute: "collision_check(target)"
    depends_on: world_model
    requires: ["manipulation"]

  can_perceive:
    compute: "head_rgb_active and object_in_fov"
    depends_on: world_model
    requires: ["vision", "body_control"]
