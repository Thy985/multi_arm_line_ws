name: dual_arm
description: Dual arm independent task benchmark
tasks:
  - task_id: dual_arm1_ready
    arm_name: arm1
    action_type: move
    zone_name: zone_a
    position_name: ready
    timeout: 30.0
  - task_id: dual_arm2_ready
    arm_name: arm2
    action_type: move
    zone_name: zone_b
    position_name: ready
    timeout: 30.0
  - task_id: dual_arm1_home
    arm_name: arm1
    action_type: move
    zone_name: zone_a
    position_name: home
    timeout: 30.0
  - task_id: dual_arm2_home
    arm_name: arm2
    action_type: move
    zone_name: zone_b
    position_name: home
    timeout: 30.0