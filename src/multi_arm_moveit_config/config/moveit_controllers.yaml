# MoveIt2 controller configuration for combined multi_arm URDF
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_scaling: 1.2
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_simple_controller_manager:
  controller_names:
    - left_arm_joint_trajectory_controller
    - right_arm_joint_trajectory_controller
    - left_arm_gripper_controller
    - right_arm_gripper_controller
    - torso_controller
    - head_controller

  left_arm_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_arm_shoulder_pan_joint
      - left_arm_shoulder_lift_joint
      - left_arm_elbow_joint
      - left_arm_wrist_1_joint
      - left_arm_wrist_2_joint
      - left_arm_wrist_3_joint

  right_arm_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - right_arm_shoulder_pan_joint
      - right_arm_shoulder_lift_joint
      - right_arm_elbow_joint
      - right_arm_wrist_1_joint
      - right_arm_wrist_2_joint
      - right_arm_wrist_3_joint

  left_arm_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    joints:
      - left_arm_robotiq_left_knuckle_joint

  right_arm_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    joints:
      - right_arm_robotiq_left_knuckle_joint

  torso_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - torso_yaw_joint

  head_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    joints:
      - neck_pitch_joint
