# MoveIt2 controller configuration for combined multi_arm URDF
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_scaling: 1.2
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_simple_controller_manager:
  controller_names:
    - arm1_joint_trajectory_controller
    - arm2_joint_trajectory_controller
    - arm1_gripper_controller
    - arm2_gripper_controller

  arm1_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm1_shoulder_pan_joint
      - arm1_shoulder_lift_joint
      - arm1_elbow_joint
      - arm1_wrist_1_joint
      - arm1_wrist_2_joint
      - arm1_wrist_3_joint

  arm2_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm2_shoulder_pan_joint
      - arm2_shoulder_lift_joint
      - arm2_elbow_joint
      - arm2_wrist_1_joint
      - arm2_wrist_2_joint
      - arm2_wrist_3_joint

  arm1_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    joints:
      - arm1_robotiq_left_knuckle_joint

  arm2_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    joints:
      - arm2_robotiq_left_knuckle_joint
