# Tabletop environment — migrated from m6_test_world.sdf
# M7 enhanced: sensors + body + perception configuration
name: tabletop
description: "Single table with objects for pick-and-place (M7 enhanced)"
version: "2.0"

world:
  gravity: [0.0, 0.0, -9.8]
  ground_plane: true
  lighting:
    type: directional
    cast_shadows: true
    direction: [0.5, 0.5, -1.0]

static_models:
  - name: table
    type: box
    position: [0.5, 0.0, 0.4]
    size: [0.8, 1.0, 0.02]
    color: [0.6, 0.4, 0.2, 1.0]
    static: true

dynamic_models:
  - object: cube
    variant: red
    position: [0.5, 0.0, 0.435]
  - object: cylinder
    variant: blue
    position: [0.3, 0.2, 0.44]

workspace_bounds:
  x: [-0.5, 1.5]
  y: [-0.5, 0.5]
  z: [0.0, 1.2]

zones:
  zone_a:
    description: "Table center"
    bounds: [0.3, -0.3, 0.42, 0.7, 0.3, 0.5]
  zone_b:
    description: "Table left"
    bounds: [0.1, -0.3, 0.42, 0.3, 0.3, 0.5]
  zone_c:
    description: "Table right"
    bounds: [0.7, -0.3, 0.42, 0.9, 0.3, 0.5]

# M7.1 Body configuration
body:
  torso:
    initial_position: 0.0
    max_velocity: 0.5
  head:
    initial_position: 0.0
    max_velocity: 0.3
    look_at: table_center

# M7.1 Sensors configuration
sensors:
  head_rgb:
    type: rgbd
    active: true
    rgb: true
    depth: true
    resolution: [640, 480]
    fps: 30
    depth_range: [0.1, 10.0]
  left_arm_wrist_camera:
    type: camera
    active: true
    rgb: true
    resolution: [640, 480]
    fps: 10
  head_imu:
    type: imu
    active: true
    frame: torso_link

# M7.4/M7.5 Perception configuration
perception:
  color_detector:
    active: true
    topic: /perception/vision_poses
    min_confidence: 0.5
    colors:
      red: [0.8, 1.0]
      blue: [0.8, 1.0]
      green: [0.8, 1.0]
  grounding:
    active: true
    gt_isolated: true
    contradiction_threshold_m: 0.3
    belief_fusion: kalman
  worldmodel:
    confidence_threshold: 0.5
    stale_threshold_s: 5.0
    uncertainty_growth: 0.001
