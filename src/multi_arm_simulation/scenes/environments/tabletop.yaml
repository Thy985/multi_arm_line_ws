# Tabletop environment — migrated from m6_test_world.sdf
name: tabletop
description: "Single table with objects for pick-and-place"
version: "1.0"

world:
  gravity: [0.0, 0.0, -9.8]
  ground_plane: true
  lighting:
    type: directional
    cast_shadows: true
    direction: [0.5, 0.5, -1.0]

static_models:
  - name: table
    type: box
    position: [0.5, 0.0, 0.4]
    size: [0.8, 1.0, 0.02]
    color: [0.6, 0.4, 0.2, 1.0]
    static: true

dynamic_models:
  - object: cube
    variant: red
    position: [0.5, 0.0, 0.435]
  - object: cylinder
    variant: blue
    position: [0.3, 0.2, 0.44]

workspace_bounds:
  x: [-0.5, 1.5]
  y: [-0.5, 0.5]
  z: [0.0, 1.2]

zones:
  zone_a:
    description: "Table center"
    bounds: [0.3, -0.3, 0.42, 0.7, 0.3, 0.5]
  zone_b:
    description: "Table left"
    bounds: [0.1, -0.3, 0.42, 0.3, 0.3, 0.5]
  zone_c:
    description: "Table right"
    bounds: [0.7, -0.3, 0.42, 0.9, 0.3, 0.5]