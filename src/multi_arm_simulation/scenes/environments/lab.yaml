# Lab environment — workbench with precision tools
# M7 enhanced: sensors + body + perception configuration
name: lab
description: "Laboratory workbench with measurement tools (M7 enhanced)"
version: "2.0"

world:
  gravity: [0.0, 0.0, -9.8]
  ground_plane: true
  lighting:
    type: directional
    cast_shadows: true
    direction: [0.5, 0.5, -1.0]

static_models:
  - name: workbench
    type: box
    position: [0.5, 0.0, 0.45]
    size: [1.2, 0.8, 0.02]
    color: [0.4, 0.4, 0.4, 1.0]
    static: true
  - name: tool_rack
    type: box
    position: [1.1, 0.0, 0.55]
    size: [0.04, 0.4, 0.2]
    color: [0.2, 0.2, 0.2, 1.0]
    static: true
  - name: measurement_plate
    type: cylinder
    position: [0.3, -0.2, 0.465]
    size: [0.1, 0.005]
    color: [0.8, 0.8, 0.8, 1.0]
    static: true

dynamic_models:
  - object: cube
    variant: red
    position: [0.5, 0.0, 0.485]
  - object: cylinder
    variant: blue
    position: [0.7, 0.1, 0.49]
  - object: box
    variant: green
    position: [0.5, 0.2, 0.485]
  - object: cube
    variant: yellow
    position: [0.3, 0.1, 0.485]

workspace_bounds:
  x: [-0.2, 1.4]
  y: [-0.5, 0.5]
  z: [0.0, 1.2]

zones:
  zone_a:
    description: "Workbench center"
    bounds: [0.3, -0.3, 0.47, 0.7, 0.3, 0.55]
  zone_b:
    description: "Measurement area"
    bounds: [0.1, -0.3, 0.47, 0.3, 0.0, 0.55]
  zone_c:
    description: "Tool rack area"
    bounds: [1.0, -0.2, 0.47, 1.2, 0.2, 0.7]

body:
  torso:
    initial_position: 0.0
    max_velocity: 0.5
  head:
    initial_position: 0.0
    max_velocity: 0.3
    look_at: workbench

sensors:
  head_rgb:
    type: rgbd
    active: true
    rgb: true
    depth: true
    resolution: [640, 480]
    fps: 30
    depth_range: [0.1, 10.0]
  left_arm_wrist_camera:
    type: camera
    active: true
    rgb: true
    resolution: [640, 480]
    fps: 10
  head_imu:
    type: imu
    active: true
    frame: torso_link

perception:
  color_detector:
    active: true
    topic: /perception/vision_poses
    min_confidence: 0.5
    colors:
      red: [0.8, 1.0]
      blue: [0.8, 1.0]
      green: [0.8, 1.0]
      yellow: [0.8, 1.0]
  grounding:
    active: true
    gt_isolated: true
    contradiction_threshold_m: 0.3
    belief_fusion: kalman
  worldmodel:
    confidence_threshold: 0.5
    stale_threshold_s: 5.0
    uncertainty_growth: 0.001
