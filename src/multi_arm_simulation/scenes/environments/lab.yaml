# Lab environment — workbench with precision tools
name: lab
description: "Laboratory workbench with measurement tools"
version: "1.0"

world:
  gravity: [0.0, 0.0, -9.8]
  ground_plane: true
  lighting:
    type: directional
    cast_shadows: true
    direction: [0.5, 0.5, -1.0]

static_models:
  - name: workbench
    type: box
    position: [0.5, 0.0, 0.45]
    size: [1.2, 0.8, 0.02]
    color: [0.4, 0.4, 0.4, 1.0]
    static: true
  - name: tool_rack
    type: box
    position: [1.1, 0.0, 0.55]
    size: [0.04, 0.4, 0.2]
    color: [0.2, 0.2, 0.2, 1.0]
    static: true
  - name: measurement_plate
    type: cylinder
    position: [0.3, -0.2, 0.465]
    size: [0.1, 0.005]
    color: [0.8, 0.8, 0.8, 1.0]
    static: true

dynamic_models:
  - object: cube
    variant: red
    position: [0.5, 0.0, 0.485]
  - object: cylinder
    variant: blue
    position: [0.7, 0.1, 0.49]
  - object: box
    variant: green
    position: [0.5, 0.2, 0.485]
  - object: cube
    variant: yellow
    position: [0.3, 0.1, 0.485]

workspace_bounds:
  x: [-0.2, 1.4]
  y: [-0.5, 0.5]
  z: [0.0, 1.2]

zones:
  zone_a:
    description: "Workbench center"
    bounds: [0.3, -0.3, 0.47, 0.7, 0.3, 0.55]
  zone_b:
    description: "Measurement area"
    bounds: [0.1, -0.3, 0.47, 0.3, 0.0, 0.55]
  zone_c:
    description: "Tool rack area"
    bounds: [1.0, -0.2, 0.47, 1.2, 0.2, 0.7]