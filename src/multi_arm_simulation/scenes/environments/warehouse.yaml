# Warehouse environment — industrial layout
name: warehouse
description: "Industrial warehouse with conveyor and pallets"
version: "1.0"

world:
  gravity: [0.0, 0.0, -9.8]
  ground_plane: true
  lighting:
    type: directional
    cast_shadows: true
    direction: [0.0, 0.0, -1.0]

static_models:
  - name: conveyor
    type: box
    position: [0.5, 0.0, 0.3]
    size: [1.5, 0.3, 0.02]
    color: [0.3, 0.3, 0.3, 1.0]
    static: true
  - name: pallet_1
    type: box
    position: [0.2, 0.6, 0.075]
    size: [0.3, 0.3, 0.15]
    color: [0.6, 0.5, 0.3, 1.0]
    static: true
  - name: pallet_2
    type: box
    position: [0.8, 0.6, 0.075]
    size: [0.3, 0.3, 0.15]
    color: [0.6, 0.5, 0.3, 1.0]
    static: true
  - name: rack
    type: box
    position: [1.3, 0.0, 0.5]
    size: [0.04, 0.8, 1.0]
    color: [0.2, 0.2, 0.2, 1.0]
    static: true

dynamic_models:
  - object: cube
    variant: red
    position: [0.2, 0.0, 0.335]
  - object: box
    variant: green
    position: [0.5, 0.0, 0.335]
  - object: cylinder
    variant: blue
    position: [0.8, 0.0, 0.34]
  - object: cube
    variant: yellow
    position: [0.2, 0.6, 0.23]

workspace_bounds:
  x: [-0.2, 1.5]
  y: [-0.5, 0.8]
  z: [0.0, 1.5]

zones:
  zone_a:
    description: "Conveyor left"
    bounds: [0.0, -0.1, 0.32, 0.4, 0.1, 0.4]
  zone_b:
    description: "Conveyor right"
    bounds: [0.6, -0.1, 0.32, 1.0, 0.1, 0.4]
  zone_c:
    description: "Pallet area"
    bounds: [0.1, 0.5, 0.16, 0.9, 0.7, 0.4]